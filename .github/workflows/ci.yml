name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 测试 (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 语法检查（所有模块都能被解析）
        run: |
          for f in src/*.mjs; do node --check "$f"; done

      - name: 单元测试（假上游，不需要 GPT-SoVITS）
        run: node --test tests/gateway.test.mjs

      - name: CLI 帮助可用
        run: node src/cli.mjs help

      - name: 配置校验（示例配置能被加载）
        # 示例里 refAudio 指向不存在的路径没关系——校验只检查字段齐全
        run: node -e "import('./src/config.mjs').then(m => { const c = m.loadConfig({ path: 'config.example.json' }); console.log('voices:', c.voices.map(v => v.id).join(',')); })"
