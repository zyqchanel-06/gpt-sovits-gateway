name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 测试 (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 语法检查
        run: |
          for f in src/*.mjs; do
            echo "-- $f"
            node --check "$f"
          done

      - name: 单元测试（假上游，不需要 GPT-SoVITS）
        run: node --test tests/gateway.test.mjs

      - name: CLI 帮助可用
        run: node src/cli.mjs help

      - name: 示例配置可加载
        run: |
          node --input-type=module -e "import { loadConfig } from './src/config.mjs'; const c = loadConfig({ path: 'config.example.json' }); console.log('voices:', c.voices.map(v => v.id).join(','));"
